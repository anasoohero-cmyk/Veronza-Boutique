<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="/manifest-admin.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VERONZA ADMIN">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=4">
  <title>VERONZA ADMIN — الطلبات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="loginView" class="screen hidden">
    <div class="login-card">
      <div class="logo">VERONZA<small>ADMIN · ORDERS</small></div>
      <h1>دخول لوحة الطلبات</h1>
      <p>هذه الصفحة مخصصة لحساب الأدمن المسجل في Veronza.</p>
      <form id="loginForm">
        <label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label>
        <label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">دخول</button>
        <div id="loginError" class="error" role="alert"></div>
      </form>
    </div>
  </div>

  <div id="appView" class="app hidden">
    <header class="topbar">
      <div><span class="eyebrow">VERONZA BOUTIQUE</span><h1>الطلبات</h1></div>
      <div class="top-actions"><div class="admin-menu-wrap"><button id="menuToggle" class="icon-btn" type="button" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div id="adminMenu" class="admin-menu"><div class="admin-menu-email" id="adminEmail"></div><a href="/admin.html">الطلبات</a><a href="/admin-products.html">المنتجات</a><button id="refreshBtn" type="button">تحديث</button><button id="logoutBtn" type="button">تسجيل الخروج</button></div></div><a href="/admin-products.html" id="productsLinkBtn" class="icon-btn" aria-label="المنتجات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8l9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></a></div>
    </header>
    <main>
      <section class="filters">
        <button class="active" data-status="all">جميع الطلبات</button>
        <button data-status="pending">جديدة 🔴</button>
        <button data-status="confirmed">تم التأكيد</button>
        <button data-status="preparing">قيد التجهيز</button>
        <button data-status="shipped">جاري التوصيل</button>
        <button data-status="delivered">تم التسليم</button>
        <button data-status="cancelled">ملغي</button>
        <button data-status="returned">مرتجع</button>
      </section>
      <section class="stats" id="stats"></section>
      <section class="orders-card">
        <div class="table-head"><h2>قائمة الطلبات</h2><span id="lastUpdated"></span></div>
        <div id="orders" class="orders"></div>
      </section>
    </main>
  </div>

  <div id="orderModal" class="modal hidden">
    <div class="modal-card">
      <div class="sheet-head"><span class="sheet-drag"></span><h2>تفاصيل الطلب</h2><button id="closeModal" class="close">×</button></div>
      <div class="sheet-body"><div id="orderDetails"></div></div>
    </div>
  </div>

  <div id="statusModal" class="modal hidden">
    <div class="modal-card">
      <div class="sheet-head"><span class="sheet-drag"></span><h2 id="statusModalTitle"></h2><button id="closeStatusModal" class="close">×</button></div>
      <div class="sheet-body"><div id="statusOrders" class="orders"></div></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
  <script src="admin-pull-refresh.js"></script>
  <script src="app-update.js"></script>
  <script src="notifications.js"></script>
  <script src="admin-chat-widget.js"></script>
  <script src="admin-menu.js"></script>
</body>
</html>
