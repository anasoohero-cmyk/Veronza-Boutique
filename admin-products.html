<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VERONZA ADMIN — المنتجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-products.css">
  <link rel="prefetch" href="/admin.html">
</head>
<body>
<div id="loginView" class="screen hidden"><div class="login-card"><div class="logo">VERONZA<small>ADMIN · PRODUCTS</small></div><h1>إدارة المنتجات</h1><p>هذه الصفحة مخصصة لحساب الأدمن المسجل في Veronza.</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">دخول</button><div id="loginError" class="error"></div></form></div></div>
<div id="appView" class="app hidden"><header><div><span class="eyebrow">VERONZA BOUTIQUE</span><h1>المنتجات</h1><p>أي تعديل محفوظ هنا يظهر مباشرة في المتجر.</p></div><div class="top-actions"><div class="admin-menu-wrap"><button id="menuToggle" class="icon-btn" type="button" aria-label="القائمة"><span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span><span class="icon-label">القائمة</span></button><div id="adminMenu" class="admin-menu"><div class="admin-menu-email" id="adminEmail"></div><a href="/" target="_blank" rel="noopener">الموقع</a><a href="/admin-home.html">الرئيسية</a><a href="/admin.html">الطلبات</a><a href="/admin-products.html">المنتجات</a><a href="/admin-inventory.html">المخزون</a><a href="/admin-users.html" id="usersMenuLink" hidden>المستخدمين</a><button id="migrateImagesBtn" type="button" title="تحويل الصور القديمة المخزنة كنص إلى ملفات حقيقية لتسريع الموقع">ترحيل الصور القديمة</button><button id="refreshBtn" type="button">تحديث</button><button id="logoutBtn" type="button">تسجيل الخروج</button><button id="copySiteLinkBtn" type="button">نسخ رابط الموقع</button></div></div></div></header>
<main><div class="toolbar"><button id="addBtn" class="primary">+ إضافة منتج</button><input id="search" type="search" placeholder="ابحث بالاسم أو الكود..."></div><section id="products" class="products"></section></main>
<nav class="bottom-nav"><a href="/admin-home.html" class="bottom-nav-item"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span>الرئيسية</a><a href="/admin.html" class="bottom-nav-item"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></span>الطلبات</a><a href="/admin-products.html" class="bottom-nav-item active"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8l9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></span>المنتجات</a><a href="/admin-inventory.html" class="bottom-nav-item"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></span>المخزون</a></nav>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-close-bar"><button id="closeModal" class="close">×</button></div><h2 id="modalTitle">إضافة منتج</h2><form id="productForm" class="form"><input type="hidden" id="productId"><input type="hidden" id="img"><div class="grid"><label>اسم المنتج *<input id="name" required></label><label class="full">وصف المنتج (اختياري)<textarea id="description" rows="3" placeholder="وصف مختصر يظهر للزباين تحت اسم المنتج"></textarea></label><label>كود المنتج *<input id="code" required readonly placeholder="يُولّد تلقائياً"></label><label>السعر *<input id="price" type="number" min="0" step="0.01" required></label><label id="discountPriceLabel">سعر بعد الخصم (اختياري)<input id="discountPrice" type="number" min="0" step="0.01" placeholder="اتركه فارغ بدون خصم"></label><label>النوع<select id="type"><option value="shoes">حذاء</option><option value="bags">شنطة</option><option value="set">Set</option></select></label><label class="full">كود الموديل * (نفس الكود للحذاء والشنطة والسيت التابعين لنفس الموديل)<div class="model-code-row"><input id="modelCode" required list="modelCodeList" placeholder="مثال: V01"><button type="button" id="genModelCode" class="ghost">موديل جديد</button></div><datalist id="modelCodeList"></datalist></label><label class="full" id="shoeLinksLabel" hidden>اربط بموديل سيت إضافي (اختياري، افصل بفاصلة لو أكتر من موديل) — لحذاء مشترك بين أكتر من سيت<input id="shoeSetLinks" placeholder="مثال: V02, V03"></label><label>الكمية *<input id="quantity" type="number" min="0" step="1" required></label><label>حالة المنتج<select id="isActive"><option value="true">متوفر</option><option value="false">غير متوفر</option></select></label><label class="full">الصورة الرئيسية *<input id="imgFile" type="file" accept="image/*" multiple hidden><button type="button" id="imgButton">📷 إضافة صورة</button><div class="preview" id="preview"></div></label><input type="hidden" id="extraImgs"><label>الألوان * (افصل بينها بفاصلة)<input id="colors" required placeholder="أسود, أبيض, بيج"></label><label class="full">المقاسات * (حدد المقاسات من 36 إلى 47)<div id="sizeOptions" class="full"></div><input id="sizes" type="hidden"></label><div id="sizeQuantities" class="full"></div></div><div class="form-actions"><button type="button" id="cancelBtn" class="ghost">إلغاء</button><button type="submit" id="saveBtn" class="primary">حفظ المنتج</button></div><div id="formError" class="error"></div></form></div></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-products.js"></script><script src="admin-pull-refresh.js"></script><script src="app-update.js"></script><script src="notifications.js"></script><script src="webrtc-call.js"></script>
  <script src="admin-chat-widget.js"></script><script src="admin-menu.js"></script>
</body></html>
