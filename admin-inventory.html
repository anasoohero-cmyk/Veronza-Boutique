<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VERONZA ADMIN">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=4">
  <title>VERONZA ADMIN — المخزون</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="admin-inventory.css">
</head>
<body>
  <div id="loginView" class="screen hidden">
    <div class="login-card">
      <div class="logo">VERONZA<small>ADMIN · INVENTORY</small></div>
      <h1>دخول إدارة المخزون</h1>
      <p>هذه الصفحة مخصصة لحساب الأدمن المسجل في Veronza.</p>
      <form id="loginForm">
        <label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label>
        <label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">دخول</button>
        <div id="loginError" class="error" role="alert"></div>
      </form>
    </div>
  </div>

  <div id="appView" class="app hidden">
    <header><div><span class="eyebrow">VERONZA BOUTIQUE</span><h1>المخزون</h1></div>
      <div class="top-actions"><div class="admin-menu-wrap"><button id="menuToggle" class="icon-btn" type="button" aria-label="القائمة"><span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span><span class="icon-label">القائمة</span></button><div id="adminMenu" class="admin-menu"><div class="admin-menu-email" id="adminEmail"></div><a href="/" target="_blank" rel="noopener">الموقع</a><a href="/admin.html">الطلبات</a><a href="/admin-products.html">المنتجات</a><a href="/admin-inventory.html">المخزون</a><a href="/admin-users.html" id="usersMenuLink" hidden>المستخدمين</a><button id="refreshBtn" type="button">تحديث</button><button id="logoutBtn" type="button">تسجيل الخروج</button></div></div><a href="/admin-products.html" id="productsLinkBtn" class="icon-btn" aria-label="المنتجات"><span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8l9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></span><span class="icon-label">المنتجات</span></a><a href="/admin.html" id="ordersLinkBtn" class="icon-btn" aria-label="الطلبات"><span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></span><span class="icon-label">الطلبات</span></a><a href="/admin-inventory.html" id="inventoryLinkBtn" class="icon-btn" aria-label="المخزون"><span class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></span><span class="icon-label">المخزون</span></a></div>
    </header>
    <main>
      <div id="noPermissionNotice" class="notice hidden">ماعندك صلاحية الوصول لقسم المخزون.</div>
      <section id="inventoryApp" class="hidden">
        <section class="stats" id="inventoryStats"></section>
        <section class="filters" id="inventoryFilters">
          <button class="active" data-filter="all">كل المنتجات</button>
          <button data-filter="low">منخفض المخزون</button>
          <button data-filter="out">نفذ من المخزون</button>
        </section>
        <section class="orders-card">
          <div class="table-head"><h2>تفاصيل المخزون</h2><span id="inventoryLastUpdated"></span></div>
          <div id="inventoryList" class="inv-list"></div>
        </section>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin-inventory.js"></script>
  <script src="admin-pull-refresh.js"></script>
  <script src="app-update.js"></script>
  <script src="notifications.js"></script>
  <script src="webrtc-call.js"></script>
  <script src="admin-chat-widget.js"></script>
  <script src="admin-menu.js"></script>
</body>
</html>
